services:
  ai-service:
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ./agent/app:/app/app
      - ./agent/packs:/app/packs
      - ./agent/knowledge:/app/knowledge
      - ./agentOS/src:/app/agentOS/src
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--reload"]
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      KINLIN_SPRING_PROFILE: compose
      SPRING_PROFILES_ACTIVE: compose
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${KINLIN_DEV_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
