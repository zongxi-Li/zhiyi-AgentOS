version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: federal-hub-postgres
    environment:
      POSTGRES_DB: federal_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - federal-hub-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: federal-hub-redis
    ports:
      - "6379:6379"
    networks:
      - federal-hub-network

  # Spring Boot后端
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: federal-hub-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT: 240000
      AGENT_PYTHON_LAWYER_CHAT_URL: http://ai-service:8000/ai/agent/lawyer/chat
      AGENT_PYTHON_TEACHER_CHAT_URL: http://ai-service:8000/ai/agent/teacher/chat
      AGENT_PYTHON_PROGRAMMER_CHAT_URL: http://ai-service:8000/ai/agent/programmer/chat
      AGENT_PYTHON_WRITER_CHAT_URL: http://ai-service:8000/ai/agent/writer/chat
      AGENT_TIMEOUT_MS: 120000
    depends_on:
      - postgres
      - redis
      - ai-service
    networks:
      - federal-hub-network

  # Python AI服务
  ai-service:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: federal-hub-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ../.env:/app/.env:ro
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      KYLIN_AI_API_KEY: ${KYLIN_AI_API_KEY}
      KYLIN_AI_ENDPOINT: ${KYLIN_AI_ENDPOINT:-https://api.kylin.ai}
    networks:
      - federal-hub-network

volumes:
  postgres_data:

networks:
  federal-hub-network:
    driver: bridge
