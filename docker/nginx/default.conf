upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Keep outer proxy timeout >= inner proxy/backend timeout
    proxy_connect_timeout 15s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    send_timeout 240s;

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 统一交给 frontend 容器内 nginx 做 /api 路由细分与重写，
    # 避免顶层与前端层规则不一致导致的 403/404。
    location /api {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # Streaming AI endpoints stay on the only trusted chain: Frontend -> Java -> Python.
    location ^~ /ai/chat/text/stream {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    # 与 /api 保持一致，/ai 也交由 frontend 层继续转发后端。
    location /ai {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }
}
