version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: federal-hub-backend-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/federal_hub
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-federal_hub}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-federal_hub_password}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TIMEOUT=240000
      - AGENT_PYTHON_LAWYER_CHAT_URL=http://ai-service:8000/ai/agent/lawyer/chat
      - AGENT_PYTHON_TEACHER_CHAT_URL=http://ai-service:8000/ai/agent/teacher/chat
      - AGENT_PYTHON_PROGRAMMER_CHAT_URL=http://ai-service:8000/ai/agent/programmer/chat
      - AGENT_PYTHON_WRITER_CHAT_URL=http://ai-service:8000/ai/agent/writer/chat
      - AGENT_TIMEOUT_MS=240000
    depends_on:
      - postgres
      - redis
    networks:
      - federal-hub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI服务
  ai-service:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: federal-hub-ai-service-prod
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - KYLIN_AI_TIMEOUT=${KYLIN_AI_TIMEOUT:-240}
      - QWEN_REQUEST_TIMEOUT=${QWEN_REQUEST_TIMEOUT:-240}
      - AGENT_SYNTHESIS_TIMEOUT=${AGENT_SYNTHESIS_TIMEOUT:-180}
      - AGENT_FEDERATED_ENABLED=true
      - AGENT_FEDERATED_BASE_URL=http://localhost:8000/ai
      - AGENT_FEDERATED_TIMEOUT_MS=1500
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY_ENABLED=false
    volumes:
      - ../.env:/app/.env:ro
      - ../agent/data:/app/data
      - ../agent/logs:/app/logs
    networks:
      - federal-hub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: federal-hub-frontend-prod
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_AI_SERVICE_URL=http://localhost:8000
    depends_on:
      - backend
      - ai-service
    networks:
      - federal-hub-network
    restart: unless-stopped

  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: federal-hub-postgres-prod
    environment:
      - POSTGRES_DB=federal_hub
      - POSTGRES_USER=${DB_USERNAME:-federal_hub}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-federal_hub_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - federal-hub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-federal_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: federal-hub-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - federal-hub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: federal-hub-nginx-prod
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - federal-hub-network
    restart: unless-stopped

networks:
  federal-hub-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
