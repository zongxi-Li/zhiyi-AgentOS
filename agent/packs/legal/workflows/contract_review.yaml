{
  "id": "legal_contract_review_v1",
  "workflowId": "legal_contract_review_v1",
  "name": "合同审查标准流程",
  "domain": "legal",
  "intent": "contract_review",
  "version": "v1",
  "runtimeEngine": "acg",
  "description": "Canonical AgentOS contract review workflow executed by the Core Native ACG ready-set scheduler with Trace, Review, Checkpoint, provenance, and self-healing.",
  "artifacts": {
    "risks": "output.artifacts.risk_detect.risks",
    "evidences": "output.artifacts.legal_evidence_match.evidences",
    "report": "output.artifacts.report_generate.report_markdown"
  },
  "steps": [
    {
      "stepId": "parse_contract",
      "name": "合同文本解析",
      "agentName": "contract_parse",
      "capability": "contract_parse",
      "nextStepId": "classify_clauses"
    },
    {
      "stepId": "classify_clauses",
      "name": "条款分类",
      "agentName": "clause_classify",
      "capability": "clause_classify",
      "input": { "fields": ["contract_type", "scope", "payment_terms"] },
      "nextStepId": "risk_detect"
    },
    {
      "stepId": "risk_detect",
      "name": "风险识别",
      "agentName": "risk_detect",
      "capability": "risk_detect",
      "input": { "fields": ["clauses"] },
      "nextStepId": "legal_evidence_match"
    },
    {
      "stepId": "legal_evidence_match",
      "name": "Evidence 依据匹配",
      "agentName": "legal_evidence_match",
      "capability": "legal_evidence_match",
      "input": { "fields": ["risks", "risk_level"] },
      "nextStepId": "suggestion_generate"
    },
    {
      "stepId": "suggestion_generate",
      "name": "修改建议生成",
      "agentName": "revision_suggest",
      "capability": "revision_suggest",
      "input": { "fields": ["risks", "evidences"] },
      "nextStepId": "human_review"
    },
    {
      "stepId": "human_review",
      "name": "人工审核",
      "agentName": "human_review",
      "capability": "human_review_gate",
      "reviewRequired": true,
      "nextStepId": "report_generate"
    },
    {
      "stepId": "report_generate",
      "name": "审查报告生成",
      "agentName": "report_generate",
      "capability": "report_generate"
      ,"input": { "fields": ["risks", "evidences", "revision_suggestions"] }
    }
  ]
}
