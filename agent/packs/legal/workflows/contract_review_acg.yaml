{
  "workflowId": "legal_contract_review_acg_v1",
  "name": "合同审查（ACG 引擎演示）",
  "domain": "legal",
  "intent": "contract_review_acg",
  "version": "1.0.0",
  "runtimeEngine": "acg",
  "description": "用 Core Native ACG 就绪集调度引擎执行合同审查，复用 legal pack 的核心智能体。演示动态拓扑、低熵通信、故障自愈。下游步骤通过 input.fields 声明数据采购清单，引擎按需精准投递。",
  "steps": [
    {
      "stepId": "contract_parse",
      "name": "合同文本解析",
      "agentName": "contract_parse",
      "capability": "contract_parse",
      "nextStepId": "clause_classify"
    },
    {
      "stepId": "clause_classify",
      "name": "条款分类",
      "agentName": "clause_classify",
      "capability": "clause_classify",
      "input": { "fields": ["contract_type", "scope", "payment_terms"] },
      "nextStepId": "risk_detect"
    },
    {
      "stepId": "risk_detect",
      "name": "风险识别",
      "agentName": "risk_detect",
      "capability": "risk_detect",
      "input": { "fields": ["clauses"] },
      "nextStepId": "legal_evidence_match"
    },
    {
      "stepId": "legal_evidence_match",
      "name": "Evidence 依据匹配",
      "agentName": "legal_evidence_match",
      "capability": "legal_evidence_match",
      "input": { "fields": ["risks", "risk_level"] },
      "nextStepId": "revision_suggest"
    },
    {
      "stepId": "revision_suggest",
      "name": "修改建议生成",
      "agentName": "revision_suggest",
      "capability": "revision_suggest",
      "input": { "fields": ["risks", "evidences"] },
      "nextStepId": "report_generate"
    },
    {
      "stepId": "report_generate",
      "name": "审查报告生成",
      "agentName": "report_generate",
      "capability": "report_generate",
      "input": { "fields": ["risks", "evidences", "revision_suggestions"] }
    }
  ]
}
