# 服务器配置
server:
  port: 8090

spring:
  application:
    name: kinlin-ai-backend
  
  # Profile配置 - 默认使用dev profile（不使用h2）
  profiles:
    active: dev

  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/kinlin_ai
    username: postgres
    password: ROOT
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# AI服务配置
ai:
  service:
    url: http://localhost:8000
    timeout: 30000

# 应用配置
app:
  upload:
    dir: uploads
    max-size: 10485760  # 10MB
  jwt:
    secret: kinlin-ai-secret-key-change-in-production
    expiration: 86400000  # 24小时（毫秒）

# CORS跨域配置
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:8080
    - http://localhost:8090
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed-headers: "*"
  allow-credentials: true

# 日志配置
logging:
  level:
    com.kinlin.ai: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
