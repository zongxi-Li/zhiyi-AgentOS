services:
  # ============================================================
  # PostgreSQL — 开发数据库
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: kinlin-postgres
    environment:
      POSTGRES_DB: kinlin_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kinlin-network

  # ============================================================
  # Redis — 缓存
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: kinlin-redis
    ports:
      - "6379:6379"
    networks:
      - kinlin-network

  # ============================================================
  # AI Service — Python FastAPI (热重载)
  # ============================================================
  ai-service:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: kinlin-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "true"
      AGENTOS_PACKS_DIR: /app/packs
      ANONYMIZED_TELEMETRY: "False"
      CHROMA_TELEMETRY_ENABLED: "false"
    volumes:
      - ./agent/app:/app/app
      - ./agent/packs:/app/packs
      - ./agent/knowledge:/app/knowledge
      - ./agent/agentos.py:/app/agentos.py
      - ./agentOS/src:/app/agentOS/src
    networks:
      - kinlin-network

  # ============================================================
  # Backend — Spring Boot dev (热重载 + 远程调试)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kinlin-backend
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kinlin_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT: 240000
      AGENT_PYTHON_LAWYER_CHAT_URL: http://ai-service:8000/ai/agent/lawyer/chat
      AGENT_PYTHON_TEACHER_CHAT_URL: http://ai-service:8000/ai/agent/teacher/chat
      AGENT_PYTHON_PROGRAMMER_CHAT_URL: http://ai-service:8000/ai/agent/programmer/chat
      AGENT_PYTHON_WRITER_CHAT_URL: http://ai-service:8000/ai/agent/writer/chat
      AGENT_TIMEOUT_MS: 240000
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      ai-service:
        condition: service_started
    networks:
      - kinlin-network

  # ============================================================
  # Frontend — Vite dev server (HMR 热更新)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kinlin-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
      - ai-service
    networks:
      - kinlin-network

volumes:
  postgres_data:

networks:
  kinlin-network:
    driver: bridge
