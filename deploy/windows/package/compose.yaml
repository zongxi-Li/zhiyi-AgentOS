name: ${KINLIN_DEPLOYMENT_ID:?KINLIN_DEPLOYMENT_ID is required}

x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-entrypoint-security: &entrypoint-security
  read_only: true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    <<: *entrypoint-security
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${KINLIN_DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      KINLIN_DB_PASSWORD_FILE: /run/kinlin-secrets/db_password
      KINLIN_DB_NAME: ${KINLIN_DB_NAME:-kinlin_ai}
      KINLIN_DB_USER: ${KINLIN_DB_USER:-kinlin_ai}
      KINLIN_SKIP_APP_INIT: ${KINLIN_SKIP_APP_INIT:-false}
    secrets: [db_admin_password, db_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    tmpfs:
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0700
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,mode=3775
    networks: [data-network]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}

  redis:
    <<: *entrypoint-security
    environment: {KINLIN_DEPLOYMENT_ID: "${KINLIN_DEPLOYMENT_ID}"}
    secrets: [redis_password]
    volumes: [redis-data:/data]
    tmpfs:
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0700
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    networks: [data-network]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: [CMD, /usr/local/bin/kinlin-redis-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}

  ai-service:
    <<: *entrypoint-security
    environment:
      KINLIN_DEPLOYMENT_ID: ${KINLIN_DEPLOYMENT_ID}
      ENVIRONMENT: production
      AGENTOS_PACKS_DIR: /app/packs
      AGENTOS_DATA_DIR: /app/data
      AGENTOS_WORKFLOW_DB_PATH: /app/data/agentos/workflows.sqlite3
      AGENTOS_SQLITE_BUSY_TIMEOUT_MS: ${AGENTOS_SQLITE_BUSY_TIMEOUT_MS:-5000}
      UVICORN_WORKERS: "1"
      AI_INTERNAL_TOKEN_FILE: /run/kinlin-secrets/ai_internal_token
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-}
      DASHSCOPE_API_KEY_FILE: ${DASHSCOPE_API_KEY_FILE:-}
      SSE_TEST_MODE: ${KINLIN_SSE_TEST_MODE:-false}
      SSE_HEARTBEAT_INTERVAL: ${SSE_HEARTBEAT_INTERVAL:-15}
      XDG_CACHE_HOME: /app/.cache
      ANONYMIZED_TELEMETRY: "False"
      CHROMA_TELEMETRY_ENABLED: "false"
    secrets: [ai_internal_token]
    volumes:
      - agentos-data:/app/data
      - ai-cache:/app/.cache
    tmpfs:
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0700
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    networks: [agent-network]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 20s
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}

  backend:
    <<: *entrypoint-security
    environment:
      KINLIN_DEPLOYMENT_ID: ${KINLIN_DEPLOYMENT_ID}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/kinlin-secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${KINLIN_DB_NAME:-kinlin_ai}
      SPRING_DATASOURCE_USERNAME: ${KINLIN_DB_USER:-kinlin_ai}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      AI_SERVICE_URL: http://ai-service:8000
      APP_UPLOAD_DIR: /app/data/uploads
      CORS_ALLOWED_ORIGINS: ${KINLIN_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      SSE_IDLE_TIMEOUT: ${SSE_IDLE_TIMEOUT:-240000}
      SSE_MAX_DURATION: ${SSE_MAX_DURATION:-1800000}
    secrets: [db_password, redis_password, jwt_secret, ai_internal_token]
    volumes: [backend-uploads:/app/data/uploads]
    tmpfs:
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0700
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    networks: [web-network, agent-network, data-network]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *default-logging
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://$$(cat /tmp/backend-listen-address):8080/health/ready"]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}

  frontend:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    networks: [web-network]
    depends_on: {backend: {condition: service_healthy}}
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}

  schema-tool:
    <<: *entrypoint-security
    profiles: [migration]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${KINLIN_DB_NAME:-kinlin_ai}
      FLYWAY_USER: ${KINLIN_DB_USER:-kinlin_ai}
      HOME: /tmp
    secrets: [db_password]
    volumes: [./migrations:/flyway/sql:ro]
    tmpfs:
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0700
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    networks: [data-network]
    depends_on: {postgres: {condition: service_healthy}}
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}

secrets:
  db_admin_password: {file: "${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/db_admin_password"}
  db_password: {file: "${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/db_password"}
  redis_password: {file: "${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/redis_password"}
  jwt_secret: {file: "${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/jwt_secret"}
  ai_internal_token: {file: "${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/ai_internal_token"}

volumes:
  postgres-data: {name: "${KINLIN_DEPLOYMENT_ID}_postgres_data_v11", labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}
  redis-data: {name: "${KINLIN_DEPLOYMENT_ID}_redis_data_v11", labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}
  agentos-data: {name: "${KINLIN_DEPLOYMENT_ID}_agentos_data_v11", labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}
  backend-uploads: {name: "${KINLIN_DEPLOYMENT_ID}_backend_uploads_v11", labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}
  ai-cache: {name: "${KINLIN_DEPLOYMENT_ID}_ai_cache_v11", labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}

networks:
  web-network: {name: "${KINLIN_DEPLOYMENT_ID}_web_network_v11", internal: true, labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}
  agent-network: {name: "${KINLIN_DEPLOYMENT_ID}_agent_network_v11", internal: false, labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}
  data-network: {name: "${KINLIN_DEPLOYMENT_ID}_data_network_v11", internal: true, labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}}
